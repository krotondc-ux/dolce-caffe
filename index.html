  'Conserve e condimenti':['#b02a1c','#fcebe8','jar'],'Latte e latticini':['#1d4ed8','#eaf0fd','milk'],'Salumi':['#be3a4d','#fcebee','ham'],'Dolci e snack':['#c2410c','#fff1e6','candy'],
  'Pane e forno':['#a16207','#fbf3e1','bread'],'Surgelati':['#0e7490','#e5f6fa','snow'],'Gelati':['#db2777','#fdeaf3','ice'],'Casa e igiene':['#0e7c66','#e3f3ee','home'],'Altro':['#57534e','#f2f1ef','box']};
/* foto prodotti: pacchetti da 100 foto, caricati solo quando servono */
const FOTO=new Map(),PACCHI={};
function pacco(n){return PACCHI[n]||(PACCHI[n]=fetch('img/p'+n+'.json').then(r=>r.json()).then(o=>{for(const k in o){const b=atob(o[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);FOTO.set(k,URL.createObjectURL(new Blob([u],{type:'image/webp'})))}}).catch(()=>{delete PACCHI[n]}))}
let fotoInCoda=false;
function mettiFoto(){fotoInCoda=false;document.querySelectorAll('img[data-cod]:not([src])').forEach(im=>{const u=FOTO.get(im.dataset.cod);if(u){im.src=u;return}pacco(im.dataset.c).then(()=>{const v=FOTO.get(im.dataset.cod);if(v&&im.isConnected)im.src=v})})}
new MutationObserver(()=>{if(!fotoInCoda){fotoInCoda=true;requestAnimationFrame(mettiFoto)}}).observe(document.documentElement,{childList:true,subtree:true});
const fotoSrc=p=>p.fotoId?'/_blob/'+p.fotoId:(p.foto||'');
function pack(p){
  if(!p)return '';
  const [c1,c2,ic]=REP[p.cat]||REP.Altro,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const src=fotoSrc(p)||(p.img?'img/'+p.cod+'.webp?v='+p.img:'');
  return `<div class="pk" style="background:${c2}"><span class="pk-ic" style="background:${c1}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[ic]}</svg></span><span class="pk-n">${esc(p.nome)}</span><span class="pk-c" style="color:${c1}">${esc(p.cat)}</span>${src?`<img src="${src}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:''}</div>`;
}
const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* Store: dati condivisi. Con il database dell'app (stesso account su telefono e tablet) i dati si vedono su tutti i dispositivi;
   altrimenti restano salvati su questo dispositivo, condivisi tra le due modalità. */
const Store={
  mode:'local',db:null,stato:null,ordini:{},onStato:null,onOrdini:null,ultimo:'',inScrittura:false,prossima:null,avvisato:false,
  start(){
    const vec=LS.get('dc.stato');const nuovo=!vec||vec.versione!==3;
    this.stato=nuovo?nuovoStato():vec;
    this.ordini=nuovo?ordiniDemo():(LS.get('dc.ordini')||ordiniDemo());
    LS.set('dc.stato',this.stato);LS.set('dc.ordini',this.ordini);
    this.ultimo=JSON.stringify(this.stato);
    addEventListener('storage',e=>{
      if(this.mode!=='local')return;
      if(e.key==='dc.stato'){const v=LS.get('dc.stato');if(v){this.stato=v;this.ultimo=JSON.stringify(v);this.onStato&&this.onStato(clone(v))}}
      if(e.key==='dc.ordini'){this.ordini=LS.get('dc.ordini')||{};this.onOrdini&&this.onOrdini(clone(this.ordini))}
    });
    this.collega();
  },
  async collega(){
    if(!window.claude||typeof window.claude.use!=='function'){if(Cloud.chiave())Cloud.avvia(this);else aggiornaSync();return}
    let db=null;try{db=await window.claude.use('db')}catch(e){}
    if(!db){aggiornaSync();return}
    this.db=db;
    const timer=setTimeout(()=>aggiornaSync(),10000);
    let seminato=false;
    db.doc('negozio/stato').onSnapshot(snap=>{
      clearTimeout(timer);
      if(!snap.exists){
        if(snap.metadata.fromCache||seminato)return;
        seminato=true;this.mode='live';aggiornaSync();
        this.scrivi(JSON.stringify(this.stato));
        const ord=this.ordini;(async()=>{for(const id of Object.keys(ord)){try{await db.doc('ordini/'+id).set(ord[id])}catch(e){this.errore(e)}}})();
        return;
      }
      const primo=this.mode!=='live';this.mode='live';if(primo)aggiornaSync();
      if((snap.data()||{}).versione!==3){if(!seminato){seminato=true;this.ripristina()}return}
      const js=JSON.stringify(snap.data());
      if(js===this.ultimo&&!primo)return;
      this.ultimo=js;this.stato=JSON.parse(js);this.onStato&&this.onStato(clone(this.stato));
    },e=>{clearTimeout(timer);this.mode='local';aggiornaSync()});
    db.collection('ordini').onSnapshot(snap=>{
      if(this.mode!=='live'&&snap.empty)return;
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      this.ordini=clone(o);this.onOrdini&&this.onOrdini(clone(o));
    },e=>{});
  },
  salvaStato(st){
    const js=JSON.stringify(st);if(js===this.ultimo)return;
    this.ultimo=js;this.stato=JSON.parse(js);
    if(this.mode==='live')this.scrivi(js);else if(this.mode==='cloud'){LS.set('dc.stato',this.stato);Cloud.salvaStato(this.stato)}else LS.set('dc.stato',this.stato);
  },
  scrivi(js){this.prossima=js;if(!this.inScrittura)this.svuota()},
  async svuota(){
    this.inScrittura=true;
    while(this.prossima){const js=this.prossima;this.prossima=null;
      try{await this.db.doc('negozio/stato').set(JSON.parse(js))}catch(e){this.errore(e)}}
    this.inScrittura=false;
  },
  async salvaOrdine(id,o){
    this.ordini[id]=clone(o);
    if(this.mode==='live'){try{await this.db.doc('ordini/'+id).set(o)}catch(e){this.errore(e)}}
    else if(this.mode==='cloud'){LS.set('dc.ordini',this.ordini);this.onOrdini&&this.onOrdini(clone(this.ordini));Cloud.scrivi('ordini/'+id,o)}
    else{LS.set('dc.ordini',this.ordini);this.onOrdini&&this.onOrdini(clone(this.ordini))}
  },
  async ripristina(reale){
    const st=nuovoStato(),ord=reale?{}:ordiniDemo(),vecchi=Object.keys(this.ordini);
    if(reale)Object.assign(st,{reale:true,incassoOggi:0,scontrini:0,crediti:[],clienti:[]});
    this.ultimo=JSON.stringify(st);this.stato=clone(st);this.ordini=clone(ord);
    if(this.mode==='live'){
      try{for(const id of vecchi)if(!ord[id])await this.db.doc('ordini/'+id).delete();
        await this.db.doc('negozio/stato').set(st);
        for(const id of Object.keys(ord))await this.db.doc('ordini/'+id).set(ord[id]);}catch(e){this.errore(e)}
    }else if(this.mode==='cloud'){LS.set('dc.stato',st);LS.set('dc.ordini',ord);
      for(const id of vecchi)if(!ord[id])await Cloud.cancella('ordini/'+id);
      await Cloud.scrivi('stato',st);for(const id of Object.keys(ord))await Cloud.scrivi('ordini/'+id,ord[id]);
    }else{LS.set('dc.stato',st);LS.set('dc.ordini',ord)}
    this.onStato&&this.onStato(clone(st));this.onOrdini&&this.onOrdini(clone(ord));
  },
  errore(e){
    if(this.avvisato)return;this.avvisato=true;
    avvisa(e&&e.code==='quota_exceeded'?'Spazio dati esaurito: le modifiche restano su questo dispositivo':'Non è stato possibile salvare online: le modifiche restano su questo dispositivo');
  }
};
/* Sincronizzazione tra telefono e tablet: database Supabase, accesso con il codice del negozio */
const Cloud={
  url:'https://wuanqhmvsymtmbqdntpl.supabase.co/rest/v1/rpc/',key:'sb_publishable_1sVjRYDOji0WTY70B8mVfQ_3pZ7bdiX',
  v:0,store:null,timer:null,coda:{},inVolo:false,errori:0,
  chiave(){return LS.get('dc.chiave')||''},
  async rpc(fn,body){const r=await fetch(this.url+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:this.key,Authorization:'Bearer '+this.key},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));const t=await r.text();return t?JSON.parse(t):null},
  async prova(ch){try{await this.rpc('dc_scrivi',{p_chiave:ch,p_k:'ping',p_data:{t:Date.now()}});return true}catch(e){return false}},
  async avvia(store){
    this.store=store;
    try{
      const righe=await this.rpc('dc_leggi',{p_chiave:this.chiave(),p_dopo:0});
      store.mode='cloud';aggiornaSync();
      const st=righe.find(r=>r.k==='stato');
      if(!st||!st.data||st.data.versione!==3){
        // primo avvio con questo codice: si caricano i dati attuali del dispositivo
        await this.scrivi('stato',store.stato,true);
        for(const id of Object.keys(store.ordini))await this.scrivi('ordini/'+id,store.ordini[id],true);
        this.v=Math.max(this.v,...righe.map(r=>r.v));
      }else this.applica(righe);
      this.timer=setInterval(()=>this.aggiorna(),4000);
      addEventListener('visibilitychange',()=>{if(!document.hidden)this.aggiorna()});
    }catch(e){store.mode='local';aggiornaSync();avvisa('Collegamento al database non riuscito: lavoro su questo dispositivo')}
  },
  applica(righe){
    const s=this.store;let cs=false,co=false;
    for(const r of righe){this.v=Math.max(this.v,r.v);
      if(r.k==='stato'&&r.data){const js=JSON.stringify(r.data);if(js!==s.ultimo&&!this.coda.stato){s.ultimo=js;s.stato=r.data;LS.set('dc.stato',r.data);cs=true}}
      else if(r.k.startsWith('ordini/')){const id=r.k.slice(7);if(this.coda[r.k])continue;if(r.data)s.ordini[id]=r.data;else delete s.ordini[id];co=true}}
    if(co)LS.set('dc.ordini',s.ordini);
    if(cs&&s.onStato)s.onStato(clone(s.stato));
    if(co&&s.onOrdini)s.onOrdini(clone(s.ordini));
  },
  async aggiorna(){if(this.inVolo||document.hidden&&Math.random()<.7)return;this.inVolo=true;
    try{const righe=await this.rpc('dc_leggi',{p_chiave:this.chiave(),p_dopo:this.v});if(righe&&righe.length)this.applica(righe);this.errori=0;if(this.store.mode!=='cloud'){this.store.mode='cloud';aggiornaSync()}}
    catch(e){if(++this.errori===3){avvisa('Connessione assente: le modifiche si inviano appena torna la rete')}}
    this.inVolo=false},
  salvaStato(st){clearTimeout(this.tStato);this.coda.stato=st;this.tStato=setTimeout(()=>this.scrivi('stato',this.coda.stato),500)},
  async scrivi(k,data,subito){this.coda[k]=data;
    for(let t=0;t<4;t++){try{const v=await this.rpc('dc_scrivi',{p_chiave:this.chiave(),p_k:k,p_data:data});if(this.coda[k]===data)delete this.coda[k];this.v=Math.max(this.v,0);return v}
      catch(e){await new Promise(r=>setTimeout(r,1500*(t+1)))}}
    setTimeout(()=>{if(this.coda[k]===data)this.scrivi(k,data)},15000)},
  async cancella(k){try{await this.rpc('dc_cancella',{p_chiave:this.chiave(),p_k:k})}catch(e){}}
};
function aggiornaSync(){
  document.querySelectorAll('[data-sync]').forEach(el=>{
    el.innerHTML=Store.mode==='live'||Store.mode==='cloud'?'<i></i>Dati sincronizzati':'<i style="background:var(--warn)"></i>Dati su questo dispositivo';
    el.title=Store.mode==='live'||Store.mode==='cloud'?'Telefono e tablet vedono gli stessi dati':'Le modifiche restano salvate su questo dispositivo';
  });
}
function avvisa(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
const KEY={fn:null};document.addEventListener('keydown',e=>{KEY.fn&&KEY.fn(e)});

function startG(){

const euro=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const $=s=>document.querySelector(s);
const OGGI=new Date();
const GIORNI=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const S={view:'cassa',cat:'Tutti',carrello:[],pzBuf:'',pzMolt:0,aiRighe:null,waLinks:null,modal:null,credSel:null,ordini:[],visti:null};
function applicaStato(st){
  S.reale=!!st.reale;S.magOn=!!st.magOn;S.cassaC=st.cassa;S.prodotti=conMagazzino(st.mag||{},S.reale);S.crediti=st.crediti;S.clienti=st.clienti;S.incassoOggi=st.incassoOggi;S.scontrini=st.scontrini;S.contanti=st.contanti||0;S.carte=st.carte||0;S.giorno=st.giorno;S.versione=st.versione||1;S.oggi=st.oggi&&st.oggi.g===st.giorno?st.oggi:{g:st.giorno,ore:{},vend:{},rep:{},cred:0};
  if(S.giorno!==isoGiorno(new Date())){S.giorno=isoGiorno(new Date());S.incassoOggi=0;S.scontrini=0;S.contanti=0;S.carte=0;S.oggi={g:S.giorno,ore:{},vend:{},rep:{},cred:0}}
  S.carrello=S.carrello.filter(r=>r.rep||S.prodotti.some(p=>p.id===r.id));
}
function applicaOrdini(o){
  S.ordini=Object.keys(o).map(id=>({...o[id],id,righe:(o[id].righe||[]).map(r=>[r.id,r.q])})).sort((a,b)=>b.ts-a.ts);
}
const statoDaSalvare=()=>({versione:3,giorno:S.giorno,incassoOggi:Math.round(S.incassoOggi*100)/100,scontrini:S.scontrini,contanti:Math.round((S.contanti||0)*100)/100,carte:Math.round((S.carte||0)*100)/100,
  reale:!!S.reale,magOn:!!S.magOn,oggi:S.oggi,cassa:S.cassaC,mag:magDa(S.prodotti,S.reale),crediti:S.crediti,clienti:S.clienti});
applicaStato(clone(Store.stato));applicaOrdini(clone(Store.ordini));S.visti=new Set(S.ordini.map(o=>o.id));
let PID=new Map(),PARR=null;const P=id=>{if(PARR!==S.prodotti||PID.size!==S.prodotti.length){PARR=S.prodotti;PID=new Map(S.prodotti.map(p=>[p.id,p]))}return PID.get(id)};
const saldo=c=>c.mov.reduce((s,m)=>s+m.v,0);
const rp=r=>r.rep?r.prezzo:P(r.id).prezzo,rn=r=>r.rep?r.nome:P(r.id).nome;
const totCarr=()=>S.carrello.reduce((s,r)=>s+rp(r)*r.q,0);
const giorniDa=iso=>Math.round((OGGI-new Date(iso))/864e5);
const iniziali=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function stato(p){return p.qta<=0?'<span class="pill out">Esaurito</span>':p.qta<p.min?'<span class="pill low">Sotto scorta</span>':'<span class="pill ok">Disponibile</span>'}
function prossima(pr){
  const step={'Ogni settimana':7,'Ogni 2 settimane':14,'Ogni mese':28,'Una volta':7}[pr.freq];
  const d=new Date(OGGI);const [h,m]=pr.ora.split(':').map(Number);
  let diff=((pr.giorno+1)%7)-d.getDay();if(diff<0||(diff===0&&(h*60+m)<=d.getHours()*60+d.getMinutes()))diff+=7;
  d.setDate(d.getDate()+diff);d.setHours(h,m);
  return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' alle '+pr.ora;
}
function descr(pr){return pr.freq==='Ogni mese'?`ogni mese, il primo ${GIORNI[pr.giorno].toLowerCase()}`:`${pr.freq.toLowerCase()}, ${['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'][pr.giorno]}`}

  </div>`:`<p class="note" style="margin-top:14px">Scansiona il codice o cerca per nome. ${S.magOn?'Quando incassi, ogni pezzo viene tolto dal magazzino in automatico.':'Il magazzino è in pausa: le vendite non scalano le giacenze.'}</p>`}`;
}
function gridCassa(){
  const box=$('#gridCassa');if(!box)return;
  let lista=S.prodotti.filter(p=>(S.cat||'Tutti')==='Tutti'||p.cat===S.cat);
  lista=cerca(lista,S.cassaQ);
  if(!S.cassaQ&&(S.cat||'Tutti')==='Tutti')lista=lista.slice().sort((a,b)=>(b.img>0)-(a.img>0));
  const n=S.cassaN||36;
  box.innerHTML=lista.length?`<div class="grid">${lista.slice(0,n).map(p=>{const r=S.carrello.find(r=>r.id===p.id);return `<button class="prod ${r?'sel':''}" data-add="${p.id}">
      <div class="img">${pack(p)}</div>${r?`<span class="cnt num">${r.q}</span>`:''}
      <span class="n">${p.nome}</span><span class="p"><b>${euro(p.prezzo)}</b><span class="muted" style="font-size:11px">${S.magOn?(p.qta<=0?'esaurito':p.qta+' pz'):''}</span></span></button>`}).join('')}</div>
    ${lista.length>n?`<button class="more" id="altriCassa">Mostra altri (${lista.length-n} rimanenti)</button>`:''}`:'<p class="note">Nessun articolo trovato.</p>';
  box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(+b.dataset.add));
  const m=$('#altriCassa');if(m)m.onclick=()=>{S.cassaN=n+36;gridCassa()};
}
function bindCassa(){
  $('#heroKpi').onclick=()=>apriKpi();
  $('#chiusura').onclick=()=>{S.modal='chiusura';render()};
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;S.cassaN=36;render()});
  $('#apriTouch').onclick=()=>cambiaModalita('C');
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const r=S.carrello[+b.dataset.rm];r.q--;if(!r.q)S.carrello=S.carrello.filter(x=>x!==r);render()});
  const bc=$('#barcode');
  bc.oninput=()=>{S.cassaQ=bc.value;S.cassaN=36;gridCassa()};
  bc.onkeydown=e=>{if(e.key!=='Enter')return;const t=bc.value.trim();const p=S.prodotti.find(p=>p.cod===t);
    if(p){S.cassaQ='';addCart(p.id);const nb=$('#barcode');nb&&nb.focus();return}
    const l=cerca(S.prodotti,t);if(l.length===1){S.cassaQ='';addCart(l[0].id)}else if(/^\d{6,}$/.test(t))toast('Codice non trovato nel catalogo')};
  gridCassa();
  if(!S.carrello.length)return;
  $('#svuota').onclick=()=>{S.carrello=[];render()};
  $('#incassa').onclick=()=>{S.modal='paga';S.ricevuto='';render()};

async function leggiFatturaGemini(file){
  const key=LS.get('dc.gemini');if(!key)throw {code:'no_key'};
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
  const prompt='Questa è la foto di una fattura o DDT di un fornitore di un negozio alimentare italiano. Estrai ogni riga di merce. Rispondi solo con JSON: {"righe":[{"ean":"codice a barre se stampato, altrimenti stringa vuota","descrizione":"descrizione articolo","quantita":numero di pezzi,"costo":costo unitario in euro senza IVA}]}. Non inventare righe; ignora trasporto, sconti e totali.';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json'}})});
  if(!r.ok)throw {code:'http_'+r.status};
  const j=await r.json(),dati=JSON.parse(j.candidates[0].content.parts[0].text);
  return (dati.righe||[]).map(x=>{const p=abbina(String(x.ean||'').replace(/\D/g,''),String(x.descrizione||''));return {id:p?p.id:null,desc:String(x.descrizione||'').slice(0,80),q:Math.round(+x.quantita||0),costo:+x.costo||0}});
}
async function leggiFattura(file){
  const sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
  if(!sample)return leggiFatturaGemini(file);
  const prompt='Questa è la foto di una fattura o DDT di un fornitore di un negozio alimentare italiano. Estrai ogni riga di merce. Rispondi solo con JSON: {"righe":[{"ean":"codice a barre se stampato, altrimenti stringa vuota","descrizione":"descrizione articolo come scritta","quantita":numero di pezzi,"costo":costo unitario in euro senza IVA}]}. Non inventare righe; ignora trasporto, sconti e totali.';

function abbina(ean,desc){
  if(ean){const p=S.prodotti.find(p=>p.cod===ean||p.cod.replace(/^0+/,'')===ean.replace(/^0+/,''));if(p)return p}
  const tk=t=>t.toUpperCase().replace(/[^A-Z0-9À-Ù ]/g,' ').split(/\s+/).filter(w=>w.length>1);
  const w=tk(desc);if(!w.length)return null;let best=null,bs=0;
  for(const p of S.prodotti){const pw=tk(p.nomeU);let c=0;w.forEach(x=>{if(pw.includes(x))c++});const sc=c/Math.max(w.length,pw.length);if(sc>bs){bs=sc;best=p}}
  return bs>=0.5?best:null;
}
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanSvg(code){
  if(!/^\d{13}$/.test(code))return '';
  const d=code.split('').map(Number),par=EAN_PAR[d[0]];
  let bits='101';
  for(let i=1;i<=6;i++)bits+=par[i-1]==='L'?EAN_L[d[i]]:EAN_G[d[i]];
  bits+='01010';
  for(let i=7;i<=12;i++)bits+=EAN_R[d[i]];
  bits+='101';
  let rects='';
  for(let i=0;i<bits.length;i++)if(bits[i]==='1')rects+='<rect x="'+(i+10)+'" y="0" width="1" height="62"/>';
  const W=bits.length+20;
  return '<svg class="ean" viewBox="0 0 '+W+' 62" preserveAspectRatio="none"><g fill="#000">'+rects+'</g></svg>';
}
function parseCSV(t){

  if(!righe.length)return [];
  const sep=(righe[0].match(/;/g)||[]).length>=(righe[0].match(/,/g)||[]).length?';':',';
  const celle=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(s=>s.trim())};
  const head=celle(righe[0]).map(h=>h.toLowerCase());
  const col=(...nomi)=>head.findIndex(h=>nomi.some(n=>h.includes(n)));
  const ix={cod:col('barcode','a barre','ean','codice'),nome:col('descr','nome','articolo'),prezzo:col('prezzo'),qta:col('giacenza','quant','qta'),min:col('scorta','minim'),iva:col('iva','aliquota'),cat:col('reparto','categoria')};

}

/* stampa: il riquadro dell'app non può aprire la stampante, quindi si scarica un file pronto che si apre e si stampa */
async function stampaFile(nome,corpo){
  const html='<!doctype html><html><head><meta charset="utf-8"><title>'+nome+'</title></head><body>'+corpo+'<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>';
  const blob=new Blob([html],{type:'text/html'});
  if(!window.claude){
    // sito normale: apre una scheda pronta da stampare; se il browser la blocca, scarica il file
    const u=URL.createObjectURL(blob);const w=window.open(u,'_blank');
    if(!w){const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();toast('File scaricato: aprilo per stampare')}
    return;
  }
  let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:nome,data:blob});toast('File salvato: aprilo e si avvia la stampa');return}catch(e){if(e&&e.code&&/declin|cancel|denied/i.test(e.code)){toast('Salvataggio annullato');return}}}
  try{window.print()}catch(e){toast('Stampa non disponibile qui')}
}

/* ================= CASSA (schermata separata) ================= */
function startC(){
const euro=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const nf=n=>n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=s=>document.querySelector(s);
const oggiISO=()=>isoGiorno(new Date());
const REP=[{c:'R01',iva:4,n:'Alimentari 4%'},{c:'R02',iva:5,n:'IVA 5%'},{c:'R03',iva:10,n:'Bar e dolci 10%'},{c:'R04',iva:22,n:'Non alimentari 22%'},{c:'R05',iva:0,n:'Esente'}];
const OPERATORI=[{nome:'Daniel',pin:'1111'},{nome:'Banco',pin:'2222'}];
let ST,PRODOTTI=[],PID=new Map();
const P=id=>PID.get(id);
function cassaNuova(prec){return {g:oggiISO(),fondo:prec?prec.fondo:0,contanti:0,carta:0,ticket:0,credito:0,prelievi:0,versamenti:0,scontrini:0,annulli:0,resi:0,docN:prec&&prec.docN||1,storico:[],punti:prec&&prec.punti||{}}}
function carica(st){
  ST=clone(st);
  if(ST.giorno!==oggiISO()){ST.giorno=oggiISO();ST.incassoOggi=0;ST.scontrini=0;ST.contanti=0;ST.carte=0;ST.oggi=null}
  if(!ST.oggi||ST.oggi.g!==ST.giorno)ST.oggi={g:ST.giorno,ore:{},vend:{},rep:{},cred:0};
  if(!ST.cassa||ST.cassa.g!==oggiISO())ST.cassa=cassaNuova(ST.cassa);
  PRODOTTI=conMagazzino(ST.mag||{},!!ST.reale);PID=new Map(PRODOTTI.map(p=>[p.id,p]));
}
function salva(){if(ST.magOn)ST.mag=magDa(PRODOTTI,!!ST.reale);Store.salvaStato(ST)}
carica(Store.stato);
const S={op:'Daniel',righe:[],sel:-1,buf:'',mul:null,sconto:{pct:0,eur:0},fid:null,lotteria:'',park:[],modal:null};
Store.onStato=st=>{carica(st);draw()};
Store.onOrdini=null;
const C=()=>ST.cassa;

/* ---------- calcoli ---------- */
const lordo=()=>S.righe.reduce((s,r)=>s+r.prezzo*r.q-(r.sc||0),0);
const totale=()=>Math.max(0,Math.round((lordo()*(1-S.sconto.pct/100)-S.sconto.eur)*100)/100);
function ivaBreak(){const f=lordo()?totale()/lordo():0;const m={};S.righe.forEach(r=>{const v=(r.prezzo*r.q-(r.sc||0))*f;m[r.iva]=(m[r.iva]||0)+v});
  return Object.keys(m).map(Number).sort((a,b)=>a-b).map(a=>({a,lordo:m[a],imposta:m[a]-m[a]/(1+a/100)}))}
function bufVal(){if(!S.buf)return null;if(S.buf.includes(','))return parseFloat(S.buf.replace(',','.'));return parseInt(S.buf,10)/100}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const cassetto=()=>C().fondo+C().contanti-C().prelievi+C().versamenti;
const ora=()=>new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const ivaDi=p=>p.iva||10;

/* ---------- vendita ---------- */
function addProd(id){const p=P(id);if(!p)return;const q=S.mul||1;
  if(ST.magOn&&p.qta<q+S.righe.filter(r=>r.id===id).reduce((s,r)=>s+r.q,0))toast('Attenzione: in magazzino risultano '+p.qta+' pezzi');
  const ex=S.righe.findIndex(r=>r.id===id&&!r.sc&&S.mul===null);
  if(ex>=0){S.righe[ex].q+=1;S.sel=ex}else{S.righe.push({id,d:p.nome,q,prezzo:p.prezzo,iva:ivaDi(p)});S.sel=S.righe.length-1}
  S.mul=null;S.buf='';draw();
}
function addRep(i){const v=bufVal();if(!v){toast('Scrivi l\'importo, poi tocca il reparto');return}const r=REP[i];const q=S.mul||1;
  S.righe.push({rep:r.c,d:'Reparto '+r.c+' · '+r.n,q,prezzo:v,iva:r.iva});S.sel=S.righe.length-1;S.mul=null;S.buf='';draw()}
function key(k){
  if(k==='C'){S.buf='';S.mul=null}
  else if(k==='B')S.buf=S.buf.slice(0,-1);
  else if(k==='X'){const v=S.buf.includes(',')?null:parseInt(S.buf||'0',10);if(!v){toast('Scrivi la quantità, poi ×');return}S.mul=Math.min(v,999);S.buf=''}
  else if(k==='PLU'){const v=parseInt(S.buf,10);const p=P(v);if(!p){toast('Scrivi il numero PLU dell\'articolo, poi PLU');return}S.buf='';addProd(p.id);return}
  else if(k===','){if(!S.buf.includes(','))S.buf=(S.buf||'0')+','}
  else{if(S.buf.length<14)S.buf=(S.buf+k).replace(/^0+(?=\d)/,'')}
  draw();
}
function byCode(c){c=c.trim();if(!c)return false;const p=PRODOTTI.find(p=>p.cod===c);if(p){addProd(p.id);return true}toast('Articolo non trovato: '+c);return false}

/* ---------- disegno ---------- */
function draw(){
  const tot=totale();
  $('#pezzi').textContent=S.righe.reduce((s,r)=>s+(r.nota?0:r.q),0)+' pezzi';
  $('#tags').innerHTML=(S.fid?`<span class="tag fid">Fidelity ${S.fid.nome} · ${S.fid.punti} punti<button data-untag="fid" aria-label="Togli fidelity">×</button></span>`:'')+(S.lotteria?`<span class="tag lot">Lotteria ${S.lotteria}<button data-untag="lot" aria-label="Togli lotteria">×</button></span>`:'')+(S.sconto.pct?`<span class="tag cred">Sconto ${S.sconto.pct}% sul totale<button data-untag="pct" aria-label="Togli sconto">×</button></span>`:'')+(S.sconto.eur?`<span class="tag cred">Abbuono ${euro(S.sconto.eur)}<button data-untag="eur" aria-label="Togli abbuono">×</button></span>`:'');
  $('#lines').innerHTML=S.righe.length?S.righe.map((r,i)=>r.nota?`<div class="line note ${S.sel===i?'sel':''}" data-l="${i}"><span class="d">${r.d}</span><span></span></div>`:`<div class="line ${S.sel===i?'sel':''}" data-l="${i}"><span class="d">${r.d}</span><span class="p">${nf(r.prezzo*r.q)}</span><span class="m num">${r.q} × ${nf(r.prezzo)} · IVA ${r.iva}%</span><span></span>${r.sc?`<span class="s">Sconto riga −${nf(r.sc)}</span>`:''}</div>`).join(''):`<div class="empty-r"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Leggi il codice a barre, cerca l'articolo<br>oppure scrivi l'importo e tocca un reparto.</div>`;
  const ib=ivaBreak();
  $('#foot').innerHTML=`<div class="row"><span>Subtotale</span><span class="num">${nf(lordo())}</span></div>${(S.sconto.pct||S.sconto.eur)?`<div class="row"><span>Sconti</span><span class="num" style="color:var(--bad)">−${nf(lordo()-tot)}</span></div>`:''}<div class="row"><span>di cui IVA</span><span class="num">${nf(ib.reduce((s,x)=>s+x.imposta,0))}</span></div><div class="tot"><span>Totale</span><b>${nf(tot)}</b></div>`;
  const v=bufVal();$('#disp').textContent=S.buf?(S.buf.includes(',')?S.buf:nf(v)):nf(tot);$('#dispLbl').textContent=S.buf?'Digitato':'Totale scontrino';
  $('#mul').hidden=!S.mul;$('#mul').textContent='× '+S.mul;
  $('#totBtnV').textContent=euro(tot);
  $('#totBtn').disabled=!S.righe.length;
  document.querySelectorAll('.paycol .pay').forEach(b=>b.disabled=!S.righe.length);
  $('#nPark').textContent=S.park.length?' ('+S.park.length+')':'';
  $('#oRich').disabled=!S.park.length;
  ['oStorno','oCorr','oPark','oAnn','oSc','oAbb'].forEach(id=>$('#'+id).disabled=!S.righe.length);
  $('#cassettoV').textContent=euro(cassetto());
  $('#opAv').textContent=S.op.slice(0,2).toUpperCase();$('#opNome').textContent=S.op;
  const live=Store.mode==='live'||Cloud.chiave();$('#sync').classList.toggle('on',!!live);$('#syncT').textContent=live?'Collegata al gestionale':'Solo su questo dispositivo';
  $('#reparti').innerHTML=REP.map((r,i)=>`<button class="rep" data-rep="${i}"><b>${r.c}</b><small>${r.iva?r.iva+'% IVA':'Esente'}</small></button>`).join('');
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>addRep(+b.dataset.rep));
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.sel=S.sel===+b.dataset.l?-1:+b.dataset.l;draw()});
  document.querySelectorAll('[data-untag]').forEach(b=>b.onclick=()=>{const t=b.dataset.untag;if(t==='fid')S.fid=null;if(t==='lot')S.lotteria='';if(t==='pct')S.sconto.pct=0;if(t==='eur')S.sconto.eur=0;draw()});
}

/* ---------- operazioni ---------- */
const selIdx=()=>S.sel>=0&&S.sel<S.righe.length?S.sel:S.righe.length-1;
$('#oStorno').onclick=()=>{const i=selIdx();const r=S.righe[i];S.righe.splice(i,1);S.sel=-1;draw();toast('Stornato: '+r.d)};

$('#oSc').onclick=()=>{const v=parseFloat((S.buf||'').replace(',','.'));if(!v||v>=100){toast('Scrivi la percentuale (es. 10), poi Sconto %');return}

$('#oAbb').onclick=()=>{const v=bufVal();if(!v){toast('Scrivi l\'importo dell\'abbuono, poi Abbuono');return}if(v>=lordo()){toast('L\'abbuono supera il totale');return}S.sconto.eur=v;S.buf='';draw();toast('Abbuono di '+euro(v))};
$('#oPark').onclick=()=>{S.park.push({righe:S.righe,sconto:S.sconto,fid:S.fid,ora:ora()});nuovo();toast('Scontrino parcheggiato')};

KEY.fn=e=>{

function docHtml(d){
  const ib={};d.righe.forEach(r=>{if(r.nota)return;const v=r.prezzo*r.q-(r.sc||0);ib[r.iva]=(ib[r.iva]||0)+v});const f=d.lordo?d.tot/d.lordo:1;
  return `<div class="doc"><div class="c"><b>DOLCE CAFFÈ</b></div><hr>
    <div class="c"><b>${d.tipo||'RIEPILOGO VENDITA'}</b><br>non valido ai fini fiscali</div><hr>

    ${d.lordo-d.tot>0.004?`<div class="r"><span>SCONTO/ABBUONO</span><span>-${nf(d.lordo-d.tot)}</span></div>`:''}<hr>
    <div class="r t"><span>TOTALE</span><span>${nf(d.tot)}</span></div>
    ${Object.keys(ib).map(a=>{const v=ib[a]*f;return `<div class="r"><span>di cui IVA ${a==0?'esente':a+'%'}</span><span>${nf(v-v/(1+a/100))}</span></div>`}).join('')}
    ${d.pagamenti.map(p=>`<div class="r"><span>${p.t}</span><span>${nf(p.v)}</span></div>`).join('')}
    ${d.resto?`<div class="r"><span>RESTO</span><span>${nf(d.resto)}</span></div>`:''}<hr>
    ${d.lotteria?`<div>CODICE LOTTERIA ${d.lotteria}</div>`:''}${d.fid?`<div>FIDELITY ${d.fid.nome} +${Math.floor(d.tot)} PUNTI</div>`:''}
    <div class="r"><span>${d.data} ${d.ora}</span><span>N. ${String(d.n).padStart(4,'0')}</span></div>
    <div class="c" style="margin-top:4px">Operatore ${d.op}</div></div>`;
}
function registraOggi(righe,tot,lordoV,credito){
  const O=ST.oggi,f=lordoV?tot/lordoV:1;
  righe.forEach(r=>{if(r.nota)return;const e=Math.round((r.prezzo*r.q-(r.sc||0))*f*100)/100;
    if(r.id){const v=O.vend[r.id]||(O.vend[r.id]=[0,0]);v[0]+=r.q;v[1]=Math.round((v[1]+e)*100)/100}
    const k=r.id?(P(r.id)||{}).cat||'Altro':r.d.replace(/^Reparto R0\d · /,'');O.rep[k]=Math.round(((O.rep[k]||0)+e)*100)/100});
  const h=new Date().getHours(),o=O.ore[h]||(O.ore[h]=[0,0]);o[0]++;o[1]=Math.round((o[1]+tot)*100)/100;
  if(credito)O.cred=Math.round(((O.cred||0)+credito)*100)/100;
}
function chiudi(pagamenti,extra={}){
  const c=C();
  const d={n:c.docN++,ora:ora(),data:new Date().toLocaleDateString('it-IT'),op:S.op,righe:S.righe.map(r=>({...r})),lordo:lordo(),tot:totale(),pagamenti,fid:S.fid,lotteria:S.lotteria,...extra};
  if(ST.magOn)S.righe.forEach(r=>{if(r.id&&P(r.id))P(r.id).qta=Math.max(0,P(r.id).qta-r.q)});
  let incassato=0,cred=0;
  pagamenti.forEach(p=>{
    if(p.t==='CONTANTI'){const v=p.v-(d.resto||0);c.contanti+=v;ST.contanti=(ST.contanti||0)+v;incassato+=v}
    if(p.t==='PAGAMENTO ELETTRONICO'){c.carta+=p.v;ST.carte=(ST.carte||0)+p.v;incassato+=p.v}
    if(p.t==='TICKET'){c.ticket+=p.v;ST.carte=(ST.carte||0)+p.v;incassato+=p.v}
    if(p.t==='NON RISCOSSO'){c.credito+=p.v;cred+=p.v}
    if(p.t==='NON FISCALE'){c.contanti+=p.v;ST.contanti=(ST.contanti||0)+p.v;incassato+=p.v}});
  c.scontrini++;
  if(incassato>0){ST.incassoOggi=Math.round(((ST.incassoOggi||0)+incassato)*100)/100;ST.scontrini=(ST.scontrini||0)+1}
  registraOggi(d.righe,d.tot,d.lordo,cred);
  if(S.fid){c.punti[S.fid.nome]=(c.punti[S.fid.nome]||0)+Math.floor(d.tot)}
  const pagTxt=pagamenti.map(p=>({'PAGAMENTO ELETTRONICO':'Carta',CONTANTI:'Contanti',TICKET:'Ticket','NON RISCOSSO':'Credito','NON FISCALE':'Non fiscale'}[p.t]||p.t)).join(' + ');
  c.storico.unshift({n:d.n,ora:d.ora,tot:d.tot,pag:pagTxt,doc:d});c.storico=c.storico.slice(0,80);
  salva();
  S.modal={doc:d};nuovo();modal();
}

    c.storico.splice(+b.dataset.rs,1);salva();S.modal={doc,rivedi:true};modal();draw();toast('Reso registrato: '+euro(s.tot))});
  if(['fondo','prelievo','versamento'].includes(m))ok.onclick=()=>{const v=parseFloat(($('#amt').value||'').replace(',','.'));if(!(v>0)){toast('Scrivi l\'importo');return}if(m==='fondo')c.fondo=v;if(m==='prelievo')c.prelievi+=v;if(m==='versamento')c.versamenti+=v;salva();S.modal=null;modal();draw();toast({fondo:'Fondo cassa impostato',prelievo:'Prelievo registrato',versamento:'Versamento registrato'}[m]+': '+euro(v))};
  if(m==='chiusura')ok.onclick=()=>{const tc=c.contanti+c.carta+c.ticket;ST.cassa=cassaNuova(c);ST.cassa.fondo=c.fondo;salva();S.modal=null;modal();draw();toast('Giornata chiusa: incassati '+euro(tc))};
  if(m.operatore){d.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{m.chi=+b.dataset.oc;m.pin='';modal()});
    d.querySelectorAll('[data-pn]').forEach(b=>b.onclick=()=>{const k=b.dataset.pn;if(k==='⌫')m.pin=m.pin.slice(0,-1);else if(m.pin.length<4)m.pin+=k;
      if(m.pin.length===4){if(m.pin===OPERATORI[m.chi].pin){S.op=OPERATORI[m.chi].nome;S.modal=null;modal();draw();toast('Operatore: '+S.op);return}toast('PIN sbagliato');m.pin=''}modal()})}
  const inp=d.querySelector('input:not([readonly])');if(inp&&!m.pay)setTimeout(()=>inp.focus(),60);
}
clearInterval(window.__clk);window.__clk=setInterval(()=>{const e=$('#clock');if(e)e.textContent=new Date().toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})+' · '+ora()},1000);
$('#clock').textContent=ora();
draw();
}

function cambiaModalita(m){
  try{localStorage.setItem('dc.modalita',m)}catch(e){}
  document.querySelectorAll('.sheet-back,.back,.toast').forEach(e=>e.remove());
  KEY.fn=null;Store.onStato=null;Store.onOrdini=null;
  const root=document.getElementById('root');root.innerHTML='';root.className='modo-'+m;
  root.appendChild(document.getElementById(m==='T'?'tplT':m==='C'?'tplC':'tplG').content.cloneNode(true));
  document.title=m==='C'?'Cassa Dolce Caffè':m==='T'?'Ordini Dolce Caffè':'Dolce Caffè';
  try{const u=new URL(location.href);u.searchParams.set('app',{G:'gestionale',T:'tablet',C:'cassa'}[m]);history.replaceState(null,'',u.pathname+u.search)}catch(e){}
  scrollTo(0,0);
  (m==='T'?startT:m==='C'?startC:startG)();
}
(async function(){
  const root=document.getElementById('root');
  root.innerHTML='<div class="scelta"><div class="scelta-box"><p>Carico il catalogo…</p></div></div>';
  try{const r=await fetch('catalogo.json');caricaCatalogo(await r.json())}
  catch(e){root.innerHTML='<div class="scelta"><div class="scelta-box"><h1>Catalogo non disponibile</h1><p>Ricarica la pagina.</p></div></div>';return}
  let mLink=null;
  try{const u=new URL(location.href),c=u.searchParams.get('c'),a=u.searchParams.get('app');
    if(c)LS.set('dc.chiave',c.trim().toUpperCase());
    if(a==='cassa')mLink='C';else if(a==='gestionale')mLink='G';else if(a==='tablet')mLink='T';
    if(c){u.searchParams.delete('c');history.replaceState(null,'',u.pathname+u.search)}}catch(e){}
  Store.start();
  let m=mLink;if(!m)try{m=localStorage.getItem('dc.modalita')}catch(e){}
  if(m==='G'||m==='T'||m==='C')cambiaModalita(m);else mostraScelta();
})();

</script>
