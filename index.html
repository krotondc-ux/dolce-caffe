const FOTO=new Map(),PACCHI={};
function pacco(n){return PACCHI[n]||(PACCHI[n]=fetch('img/p'+n+'.json').then(r=>r.json()).then(o=>{for(const k in o){const b=atob(o[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);FOTO.set(k,URL.createObjectURL(new Blob([u],{type:'image/webp'})))}}).catch(()=>{delete PACCHI[n]}))}
let fotoInCoda=false;
function mettiFoto(){fotoInCoda=false;document.querySelectorAll('img[data-cod]:not([src])').forEach(im=>{const u=FOTO.get(im.dataset.cod);if(u){im.src=u;return}pacco(im.dataset.c).then(()=>{const v=FOTO.get(im.dataset.cod);if(v&&im.isConnected)im.src=v})})}
new MutationObserver(()=>{if(!fotoInCoda){fotoInCoda=true;requestAnimationFrame(mettiFoto)}}).observe(document.documentElement,{childList:true,subtree:true});
const fotoSrc=p=>p.fotoId?'/_blob/'+p.fotoId:(p.foto||'');
function pack(p){
  if(!p)return '';
  const [c1,c2,ic]=REP[p.cat]||REP.Altro,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const src=fotoSrc(p)||(p.img?'img/'+p.cod+'.webp?v='+p.img:'');
  return `<div class="pk" style="background:${c2}"><span class="pk-ic" style="background:${c1}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[ic]}</svg></span><span class="pk-n">${esc(p.nome)}</span><span class="pk-c" style="color:${c1}">${esc(p.cat)}</span>${src?`<img src="${src}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:''}</div>`;
}
const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},

  del(k){try{localStorage.removeItem(k)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* Store: dati condivisi. Con il database dell'app (stesso account su telefono e tablet) i dati si vedono su tutti i dispositivi;
   altrimenti restano salvati su questo dispositivo, condivisi tra le due modalità. */
const Store={
  mode:'local',db:null,stato:null,ordini:{},onStato:null,onOrdini:null,ultimo:'',inScrittura:false,prossima:null,avvisato:false,
  start(){
    const vec=LS.get('dc.stato');const nuovo=!vec||vec.versione!==2;
    this.stato=nuovo?nuovoStato():vec;
    this.ordini=nuovo?ordiniDemo():(LS.get('dc.ordini')||ordiniDemo());
    LS.set('dc.stato',this.stato);LS.set('dc.ordini',this.ordini);
    this.ultimo=JSON.stringify(this.stato);
    addEventListener('storage',e=>{
      if(this.mode!=='local')return;
      if(e.key==='dc.stato'){const v=LS.get('dc.stato');if(v){this.stato=v;this.ultimo=JSON.stringify(v);this.onStato&&this.onStato(clone(v))}}
      if(e.key==='dc.ordini'){this.ordini=LS.get('dc.ordini')||{};this.onOrdini&&this.onOrdini(clone(this.ordini))}
    });
    this.collega();
  },
  async collega(){
    if(!window.claude||typeof window.claude.use!=='function'){if(Cloud.chiave())Cloud.avvia(this);else aggiornaSync();return}
    let db=null;try{db=await window.claude.use('db')}catch(e){}
    if(!db){aggiornaSync();return}
    this.db=db;
    const timer=setTimeout(()=>aggiornaSync(),10000);
    let seminato=false;
    db.doc('negozio/stato').onSnapshot(snap=>{
      clearTimeout(timer);
      if(!snap.exists){
        if(snap.metadata.fromCache||seminato)return;
        seminato=true;this.mode='live';aggiornaSync();
        this.scrivi(JSON.stringify(this.stato));
        const ord=this.ordini;(async()=>{for(const id of Object.keys(ord)){try{await db.doc('ordini/'+id).set(ord[id])}catch(e){this.errore(e)}}})();
        return;
      }
      const primo=this.mode!=='live';this.mode='live';if(primo)aggiornaSync();
      if((snap.data()||{}).versione!==2){if(!seminato){seminato=true;this.ripristina()}return}
      const js=JSON.stringify(snap.data());
      if(js===this.ultimo&&!primo)return;
      this.ultimo=js;this.stato=JSON.parse(js);this.onStato&&this.onStato(clone(this.stato));
    },e=>{clearTimeout(timer);this.mode='local';aggiornaSync()});
    db.collection('ordini').onSnapshot(snap=>{
      if(this.mode!=='live'&&snap.empty)return;
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      this.ordini=clone(o);this.onOrdini&&this.onOrdini(clone(o));
    },e=>{});
  },
  salvaStato(st){
    const js=JSON.stringify(st);if(js===this.ultimo)return;
    this.ultimo=js;this.stato=JSON.parse(js);
    if(this.mode==='live')this.scrivi(js);else if(this.mode==='cloud'){LS.set('dc.stato',this.stato);Cloud.salvaStato(this.stato)}else LS.set('dc.stato',this.stato);
  },
  scrivi(js){this.prossima=js;if(!this.inScrittura)this.svuota()},
  async svuota(){
    this.inScrittura=true;
    while(this.prossima){const js=this.prossima;this.prossima=null;
      try{await this.db.doc('negozio/stato').set(JSON.parse(js))}catch(e){this.errore(e)}}
    this.inScrittura=false;
  },
  async salvaOrdine(id,o){
    this.ordini[id]=clone(o);
    if(this.mode==='live'){try{await this.db.doc('ordini/'+id).set(o)}catch(e){this.errore(e)}}
    else if(this.mode==='cloud'){LS.set('dc.ordini',this.ordini);this.onOrdini&&this.onOrdini(clone(this.ordini));Cloud.scrivi('ordini/'+id,o)}
    else{LS.set('dc.ordini',this.ordini);this.onOrdini&&this.onOrdini(clone(this.ordini))}
  },
  async ripristina(){
    const st=nuovoStato(),ord=ordiniDemo(),vecchi=Object.keys(this.ordini);
    this.ultimo=JSON.stringify(st);this.stato=clone(st);this.ordini=clone(ord);
    if(this.mode==='live'){
      try{for(const id of vecchi)if(!ord[id])await this.db.doc('ordini/'+id).delete();
        await this.db.doc('negozio/stato').set(st);
        for(const id of Object.keys(ord))await this.db.doc('ordini/'+id).set(ord[id]);}catch(e){this.errore(e)}
    }else if(this.mode==='cloud'){LS.set('dc.stato',st);LS.set('dc.ordini',ord);
      for(const id of vecchi)if(!ord[id])await Cloud.cancella('ordini/'+id);
      await Cloud.scrivi('stato',st);for(const id of Object.keys(ord))await Cloud.scrivi('ordini/'+id,ord[id]);
    }else{LS.set('dc.stato',st);LS.set('dc.ordini',ord)}
    this.onStato&&this.onStato(clone(st));this.onOrdini&&this.onOrdini(clone(ord));
  },
  errore(e){
    if(this.avvisato)return;this.avvisato=true;
    avvisa(e&&e.code==='quota_exceeded'?'Spazio dati esaurito: le modifiche restano su questo dispositivo':'Non è stato possibile salvare online: le modifiche restano su questo dispositivo');
  }
};
/* Sincronizzazione tra telefono e tablet: database Supabase, accesso con il codice del negozio */
const Cloud={
  url:'https://wuanqhmvsymtmbqdntpl.supabase.co/rest/v1/rpc/',key:'sb_publishable_1sVjRYDOji0WTY70B8mVfQ_3pZ7bdiX',
  v:0,store:null,timer:null,coda:{},inVolo:false,errori:0,
  chiave(){return LS.get('dc.chiave')||''},
  async rpc(fn,body){const r=await fetch(this.url+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:this.key,Authorization:'Bearer '+this.key},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));const t=await r.text();return t?JSON.parse(t):null},
  async prova(ch){try{await this.rpc('dc_scrivi',{p_chiave:ch,p_k:'ping',p_data:{t:Date.now()}});return true}catch(e){return false}},
  async avvia(store){
    this.store=store;
    try{
      const righe=await this.rpc('dc_leggi',{p_chiave:this.chiave(),p_dopo:0});
      store.mode='cloud';aggiornaSync();
      const st=righe.find(r=>r.k==='stato');
      if(!st||!st.data||st.data.versione!==2){
        // primo avvio con questo codice: si caricano i dati attuali del dispositivo
        await this.scrivi('stato',store.stato,true);
        for(const id of Object.keys(store.ordini))await this.scrivi('ordini/'+id,store.ordini[id],true);
        this.v=Math.max(this.v,...righe.map(r=>r.v));
      }else this.applica(righe);
      this.timer=setInterval(()=>this.aggiorna(),4000);
      addEventListener('visibilitychange',()=>{if(!document.hidden)this.aggiorna()});
    }catch(e){store.mode='local';aggiornaSync();avvisa('Collegamento al database non riuscito: lavoro su questo dispositivo')}
  },
  applica(righe){
    const s=this.store;let cs=false,co=false;
    for(const r of righe){this.v=Math.max(this.v,r.v);
      if(r.k==='stato'&&r.data){const js=JSON.stringify(r.data);if(js!==s.ultimo&&!this.coda.stato){s.ultimo=js;s.stato=r.data;LS.set('dc.stato',r.data);cs=true}}
      else if(r.k.startsWith('ordini/')){const id=r.k.slice(7);if(this.coda[r.k])continue;if(r.data)s.ordini[id]=r.data;else delete s.ordini[id];co=true}}
    if(co)LS.set('dc.ordini',s.ordini);
    if(cs&&s.onStato)s.onStato(clone(s.stato));
    if(co&&s.onOrdini)s.onOrdini(clone(s.ordini));
  },
  async aggiorna(){if(this.inVolo||document.hidden&&Math.random()<.7)return;this.inVolo=true;
    try{const righe=await this.rpc('dc_leggi',{p_chiave:this.chiave(),p_dopo:this.v});if(righe&&righe.length)this.applica(righe);this.errori=0;if(this.store.mode!=='cloud'){this.store.mode='cloud';aggiornaSync()}}
    catch(e){if(++this.errori===3){avvisa('Connessione assente: le modifiche si inviano appena torna la rete')}}
    this.inVolo=false},
  salvaStato(st){clearTimeout(this.tStato);this.coda.stato=st;this.tStato=setTimeout(()=>this.scrivi('stato',this.coda.stato),500)},
  async scrivi(k,data,subito){this.coda[k]=data;
    for(let t=0;t<4;t++){try{const v=await this.rpc('dc_scrivi',{p_chiave:this.chiave(),p_k:k,p_data:data});if(this.coda[k]===data)delete this.coda[k];this.v=Math.max(this.v,0);return v}
      catch(e){await new Promise(r=>setTimeout(r,1500*(t+1)))}}
    setTimeout(()=>{if(this.coda[k]===data)this.scrivi(k,data)},15000)},
  async cancella(k){try{await this.rpc('dc_cancella',{p_chiave:this.chiave(),p_k:k})}catch(e){}}
};
function aggiornaSync(){
  document.querySelectorAll('[data-sync]').forEach(el=>{
    el.innerHTML=Store.mode==='live'||Store.mode==='cloud'?'<i></i>Dati sincronizzati':'<i style="background:var(--warn)"></i>Dati su questo dispositivo';
    el.title=Store.mode==='live'||Store.mode==='cloud'?'Telefono e tablet vedono gli stessi dati':'Le modifiche restano salvate su questo dispositivo';
  });
}

function prossima(pr){
  const step={'Ogni settimana':7,'Ogni 2 settimane':14,'Ogni mese':28,'Una volta':7}[pr.freq];
  const d=new Date(OGGI);const [h,m]=pr.ora.split(':').map(Number);
  let diff=((pr.giorno+1)%7)-d.getDay();if(diff<0||(diff===0&&(h*60+m)<=d.getHours()*60+d.getMinutes()))diff+=7;
  d.setDate(d.getDate()+diff);d.setHours(h,m);
  return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' alle '+pr.ora;

      <span class="n">${p.nome}</span><span class="p"><b>${euro(p.prezzo)}</b><span class="muted" style="font-size:11px">${p.qta<=0?'esaurito':p.qta+' pz'}</span></span></button>`}).join('')}</div>

async function leggiFatturaGemini(file){
  const key=LS.get('dc.gemini');if(!key)throw {code:'no_key'};
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
  const prompt='Questa è la foto di una fattura o DDT di un fornitore di un negozio alimentare italiano. Estrai ogni riga di merce. Rispondi solo con JSON: {"righe":[{"ean":"codice a barre se stampato, altrimenti stringa vuota","descrizione":"descrizione articolo","quantita":numero di pezzi,"costo":costo unitario in euro senza IVA}]}. Non inventare righe; ignora trasporto, sconti e totali.';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json'}})});
  if(!r.ok)throw {code:'http_'+r.status};
  const j=await r.json(),dati=JSON.parse(j.candidates[0].content.parts[0].text);
  return (dati.righe||[]).map(x=>{const p=abbina(String(x.ean||'').replace(/\D/g,''),String(x.descrizione||''));return {id:p?p.id:null,desc:String(x.descrizione||'').slice(0,80),q:Math.round(+x.quantita||0),costo:+x.costo||0}});
}
async function leggiFattura(file){
  const sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
  if(!sample)return leggiFatturaGemini(file);
  const prompt='Questa è la foto di una fattura o DDT di un fornitore di un negozio alimentare italiano. Estrai ogni riga di merce. Rispondi solo con JSON: {"righe":[{"ean":"codice a barre se stampato, altrimenti stringa vuota","descrizione":"descrizione articolo come scritta","quantita":numero di pezzi,"costo":costo unitario in euro senza IVA}]}. Non inventare righe; ignora trasporto, sconti e totali.';
  const dati=await sample.json(prompt,{images:[file],modelTier:'default'});
  return (dati.righe||[]).map(x=>{const p=abbina(String(x.ean||'').replace(/\D/g,''),String(x.descrizione||''));return {id:p?p.id:null,desc:String(x.descrizione||'').slice(0,80),q:Math.round(+x.quantita||0),costo:+x.costo||0}});
}
function abbina(ean,desc){
  if(ean){const p=S.prodotti.find(p=>p.cod===ean||p.cod.replace(/^0+/,'')===ean.replace(/^0+/,''));if(p)return p}
  const tk=t=>t.toUpperCase().replace(/[^A-Z0-9À-Ù ]/g,' ').split(/\s+/).filter(w=>w.length>1);
  const w=tk(desc);if(!w.length)return null;let best=null,bs=0;
  for(const p of S.prodotti){const pw=tk(p.nomeU);let c=0;w.forEach(x=>{if(pw.includes(x))c++});const sc=c/Math.max(w.length,pw.length);if(sc>bs){bs=sc;best=p}}
  return bs>=0.5?best:null;
}
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanSvg(code){
  if(!/^\d{13}$/.test(code))return '';
  const d=code.split('').map(Number),par=EAN_PAR[d[0]];
  let bits='101';
  for(let i=1;i<=6;i++)bits+=par[i-1]==='L'?EAN_L[d[i]]:EAN_G[d[i]];
  bits+='01010';
  for(let i=7;i<=12;i++)bits+=EAN_R[d[i]];
  bits+='101';
  let rects='';
  for(let i=0;i<bits.length;i++)if(bits[i]==='1')rects+='<rect x="'+(i+10)+'" y="0" width="1" height="62"/>';
  const W=bits.length+20;
  return '<svg class="ean" viewBox="0 0 '+W+' 62" preserveAspectRatio="none"><g fill="#000">'+rects+'</g></svg>';
}
function parseCSV(t){
  const righe=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!righe.length)return [];
  const sep=(righe[0].match(/;/g)||[]).length>=(righe[0].match(/,/g)||[]).length?';':',';
  const celle=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(s=>s.trim())};
  const head=celle(righe[0]).map(h=>h.toLowerCase());
  const col=(...nomi)=>head.findIndex(h=>nomi.some(n=>h.includes(n)));
  const ix={cod:col('barcode','a barre','ean','codice'),nome:col('descr','nome','articolo'),prezzo:col('prezzo'),qta:col('giacenza','quant','qta'),min:col('scorta','minim'),iva:col('iva','aliquota'),cat:col('reparto','categoria')};
  return righe.slice(1).map(celle).map(c=>({cod:c[ix.cod]||'',nome:c[ix.nome]||'',prezzo:parseFloat((c[ix.prezzo]||'').replace(',','.'))||0,qta:ix.qta>=0?(parseInt(c[ix.qta])||0):null,min:ix.min>=0?(parseInt(c[ix.min])||0):null,iva:ix.iva>=0?(parseInt(c[ix.iva])||22):22,cat:(ix.cat>=0&&c[ix.cat])||'Altro'})).filter(r=>r.nome);
}
function pianoImport(righe){

function applicaImport(piano,rimuovi){

async function stampaFile(nome,corpo){
  const html='<!doctype html><html><head><meta charset="utf-8"><title>'+nome+'</title></head><body>'+corpo+'<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>';
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:nome,data:new Blob([html],{type:'text/html'})});toast('File salvato: aprilo e si avvia la stampa');return}catch(e){if(e&&e.code&&/declin|cancel|denied/i.test(e.code)){toast('Salvataggio annullato');return}}}
  try{const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');if(!w)window.print()}catch(e){toast('Stampa non disponibile qui')}
}

    <div class="row"><div><b>Ricordamelo</b><div class="muted">Ti arriva una notifica sul telefono</div></div><button class="switch ${pr.on?'on':''}" id="swOn" aria-label="Attiva promemoria" aria-pressed="${pr.on}"></button></div>
    <div ${pr.on?'':'hidden'} class="stack">
      <div class="seg">${['Ogni settimana','Ogni 2 settimane','Ogni mese','Una volta'].map(f=>`<button class="${pr.freq===f?'on':''}" data-fq="${f}">${f}</button>`).join('')}</div>
      <div class="days">${GIORNI.map((g,i)=>`<button class="${pr.giorno===i?'on':''}" data-gg="${i}">${g}</button>`).join('')}</div>
      <div class="row"><span class="muted">Ora</span><input type="time" id="oraProm" value="${pr.ora}" style="width:130px"></div>
      <div class="row"><div><b>Avvisa anche il cliente su WhatsApp</b><div class="muted">Messaggio gentile con l'importo</div></div><button class="switch ${pr.wa?'on':''}" id="swWa" aria-label="Avvisa il cliente" aria-pressed="${pr.wa}"></button></div>
      ${pr.wa?`<div class="preview-msg">Ciao ${c.nome}, ti ricordiamo che il saldo aperto con Dolce Caffè è di ${euro(saldo(c))}. Puoi passare in negozio o fare un bonifico. Grazie! ☕</div>`:''}

}
function bindCrediti(){

    document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{S.credSel=+b.dataset.cr;render();scrollTo(0,0)});
    $('#nuovoCred').onclick=()=>{S.modal='nuovoCred';render()};return;
  }
  const c=S.crediti.find(c=>c.id===S.credSel);
  $('#indietro').onclick=()=>{S.credSel=null;render()};
  $('#regPag').onclick=()=>{const v=+$('#impPag').value;if(!(v>0)){toast('Scrivi un importo');return}c.mov.push({d:oggiStr(),t:'Pagamento ricevuto',v:-v});render();toast(saldo(c)<=0.005?'Debito saldato':'Pagamento registrato, resta '+euro(saldo(c)))};
  $('#addDeb').onclick=()=>{const v=+$('#impPag').value;if(!(v>0)){toast('Scrivi l\'importo nel campo sopra');return}c.mov.push({d:oggiStr(),t:'Spesa a credito',v});render();toast('Aggiunti '+euro(v)+' al conto')};
  $('#swOn').onclick=()=>{c.prom.on=!c.prom.on;render()};

  def.forEach(([re,...nomi],k)=>{const id=trova(re),p=CATID.get(id);if(!p||o[id])return;

const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;

  const best=rows.reduce((a,b)=>b.ult<a.ult?b:a);rows.forEach(r=>r.best=r===best);
  const risp=rows.filter(r=>!r.best).reduce((s,r)=>s+(r.ult-best.ult)*r.qta/6,0);return {d,rows,best,risp}}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const PER={
  Settimana:{lab:['Gio','Ven','Sab','Dom','Lun','Mar','Mer'],k:1,prev:'settimana scorsa'},
  Mese:{lab:Array.from({length:30},(_,i)=>String(i+5>31?i+5-31:i+5)),k:4.3,prev:'mese scorso'},

function serie(p){seed=p==='Settimana'?11:p==='Mese'?29:53;const L=PER[p].lab.length;const base=p==='Anno'?9800:390;
  const cur=[],old=[];for(let i=0;i<L;i++){const w=p==='Anno'?(1+.25*Math.sin((i-6)/12*6.28)):p==='Settimana'?[1,1.15,1.35,.55,.9,.95,1.05][i]:(1+.3*Math.sin(i/7*6.28));cur.push(Math.round(base*w*(1.02+rnd()*.2)));old.push(Math.round(base*w*(.9+rnd()*.18)))}return {cur,old}}
function lineChart(id,labels,ser,fmt){
  const W=340,H=170,pl=40,pr=8,pt=10,pb=24;const all=ser.flatMap(s=>s.v);let mx=Math.max(...all),mn=Math.min(...all,0);
  if(fmt.zero===false){const sp=(mx-Math.min(...all))||1;mn=Math.min(...all)-sp*.4;mx=mx+sp*.4;}
  const step=niceStep((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const x=i=>pl+i*(W-pl-pr)/(labels.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn||1));
  let g='';for(let v=mn;v<=mx+1e-9;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt.axis(v)}</text>`;
  const every=Math.ceil(labels.length/7);labels.forEach((l,i)=>{if(i%every===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`});
  ser.forEach(s=>{const d=s.v.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    if(s.area)g+=`<path d="${d} L${x(s.v.length-1)} ${y(mn)} L${x(0)} ${y(mn)}Z" fill="${s.c}" opacity=".10"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    if(!s.dash){const i=s.v.length-1;g+=`<circle cx="${x(i)}" cy="${y(s.v[i])}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`}});
  g+=`<line id="${id}-x" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/><rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="${id}-hit"/>`;
  setTimeout(()=>{const hit=document.getElementById(id+'-hit');if(!hit)return;const svg=hit.ownerSVGElement,box=svg.parentNode,tip=box.querySelector('.tip'),ln=document.getElementById(id+'-x');
    const mv=e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(labels.length-1,Math.round((sx-pl)/((W-pl-pr)/(labels.length-1)))));
      ln.setAttribute('x1',x(i));ln.setAttribute('x2',x(i));ln.setAttribute('opacity','.6');tip.hidden=false;tip.style.left=(x(i)*r.width/W)+'px';tip.style.top=(Math.min(...ser.map(s=>y(s.v[i])))*r.height/H)+'px';
      tip.innerHTML=`<div style="opacity:.75">${fmt.label(labels[i])}</div>`+ser.map(s=>`<div><span class="dot" style="background:${s.c};width:8px;height:8px"></span>${s.n}: <b>${fmt.tip(s.v[i])}</b></div>`).join('')};
    hit.onpointermove=mv;hit.onpointerdown=mv;hit.onpointerleave=()=>{tip.hidden=true;ln.setAttribute('opacity','0')}},0);
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico">${g}</svg><div class="tip" hidden></div></div><div class="legend">${ser.map(s=>`<span><i style="background:${s.c}${s.dash?';background:repeating-linear-gradient(90deg,'+s.c+' 0 4px,transparent 4px 7px)':''}"></i>${s.n}</span>`).join('')}</div>`;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
